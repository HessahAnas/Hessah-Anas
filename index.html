*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  background:var(--night);
  color:var(--cream);
  font-family:'IBM Plex Sans Arabic', sans-serif;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:geometricPrecision;
  -webkit-text-size-adjust:100%;
  overflow:hidden;
  height:100%;
}
body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 24px;
  position:relative;
}

body::before{
  content:""; position:fixed; inset:0;
  background:
    radial-gradient(ellipse at 50% 0%, rgba(201,168,76,.07) 0%, transparent 60%),
    radial-gradient(ellipse at 50% 100%, rgba(184,92,92,.06) 0%, transparent 70%),
    var(--night);
  z-index:-1;
}

.grain{
  position:fixed; inset:0; pointer-events:none; z-index:60;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='280' height='280'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.96 0 0 0 0 0.93 0 0 0 0 0.85 0 0 0 0.5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  mix-blend-mode:overlay;
  opacity:.07;
}

/* =========================================================
   3 FLOATING LOGOS
   ========================================================= */
.flora{
  position:fixed; inset:0; pointer-events:none; z-index:0;
  overflow:hidden;
}
.flora .logo-float{
  position:absolute;
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;
  aspect-ratio:244/994;
  will-change:transform, opacity;
  filter:drop-shadow(0 0 30px rgba(201,168,76,.15));
}

/* Logo 1 — large, gold, upper-left, slow drift */
.flora .l1{
  height:80vmin;
  top:-8vmin;
  left:-6vmin;
  background-image:var(--logo-gold);
  opacity:.10;
  animation:drift1 32s ease-in-out infinite;
}
/* Logo 2 — medium, cream, lower-right */
.flora .l2{
  height:60vmin;
  bottom:-4vmin;
  right:-4vmin;
  background-image:var(--logo-cream);
  opacity:.08;
  animation:drift2 38s ease-in-out infinite;
}
/* Logo 3 — small, gold, mid-right, off-center */
.flora .l3{
  height:42vmin;
  top:38%;
  right:14%;
  background-image:var(--logo-gold);
  opacity:.07;
  animation:drift3 28s ease-in-out infinite;
}

@keyframes drift1{
  0%   {transform:translate(0,0) rotate(-6deg);}
  50%  {transform:translate(8vw, 10vh) rotate(4deg);}
  100% {transform:translate(0,0) rotate(-6deg);}
}
@keyframes drift2{
  0%   {transform:translate(0,0) rotate(8deg);}
  50%  {transform:translate(-10vw,-12vh) rotate(-3deg);}
  100% {transform:translate(0,0) rotate(8deg);}
}
@keyframes drift3{
  0%   {transform:translate(0,0) rotate(-3deg);}
  50%  {transform:translate(-7vw, 9vh) rotate(7deg);}
  100% {transform:translate(0,0) rotate(-3deg);}
}

/* =========================================================
   COUNTDOWN
   ========================================================= */
.stage{
  position:relative;
  z-index:2;
  text-align:center;
  width:100%;
  max-width:520px;
  display:flex; flex-direction:column; align-items:center;
}

.stage > *{
  opacity:0;
  animation:fade-up 1.2s cubic-bezier(.2,.7,.2,1) forwards;
}
.eyebrow{ animation-delay:.2s; }
.days-hero{ animation-delay:.5s; }
.days-noun{ animation-delay:.8s; }
.units-row{ animation-delay:1.1s; }
.time-band{ animation-delay:1.4s; }
.signature{ animation-delay:1.7s; }

@keyframes fade-up{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}

.eyebrow{
  font-family:'Amiri', serif;
  font-weight:400;
  font-size:clamp(20px, 5.2vw, 26px);
  color:var(--cream);
  letter-spacing:.01em;
  margin-bottom:32px;
  padding-bottom:18px;
  text-align:center;
  width:100%;
  position:relative;
}
.eyebrow::after{
  content:""; position:absolute;
  left:50%; bottom:0;
  transform:translateX(-50%);
  width:60px; height:1px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
}

.days-hero{
  font-family:'Aref Ruqaa', serif;
  font-weight:700;
  font-size:clamp(140px, 38vw, 260px);
  line-height:.85;
  color:var(--bloom);
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";
  text-shadow:0 0 40px rgba(184,92,92,.25);
  animation:fade-up 1.2s cubic-bezier(.2,.7,.2,1) .5s forwards, breathe 6s ease-in-out 2s infinite;
}
@keyframes breathe{
  0%,100%{opacity:1;}
  50%{opacity:.82;}
}

.days-noun{
  font-family:'Amiri', serif;
  font-weight:700;
  font-size:clamp(28px, 7vw, 40px);
  color:var(--cream);
  margin-top:6px;
}

.units-row{
  display:flex; align-items:center; justify-content:center;
  margin-top:38px;
  border-top:1px solid var(--hair);
  border-bottom:1px solid var(--hair);
  padding:18px 0;
  width:100%;
  max-width:380px;
}
.unit-cell{
  flex:1;
  display:flex; flex-direction:column; align-items:center;
  position:relative;
}
.unit-cell + .unit-cell::before{
  content:""; position:absolute; right:0; top:8px; bottom:8px;
  width:1px; background:var(--hair);
}
.unit-num{
  font-family:'Aref Ruqaa', serif;
  font-weight:700;
  font-size:clamp(30px, 7.5vw, 44px);
  line-height:1;
  color:var(--cream);
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";
}
.unit-name{
  font-family:'IBM Plex Sans Arabic', sans-serif;
  font-weight:300;
  font-size:11px;
  letter-spacing:.3em;
  color:var(--cream-dim);
  margin-top:10px;
}
.tick-bloom{
  display:inline-block;
  width:5px; height:5px; border-radius:50%;
  background:var(--bloom);
  margin-inline-start:8px;
  vertical-align:middle;
  animation:tick-bloom 1s steps(2) infinite;
}
@keyframes tick-bloom{
  0%,50%{opacity:1;} 51%,100%{opacity:.25;}
}

.time-band{
  margin-top:24px;
  font-family:'IBM Plex Sans Arabic', sans-serif;
  font-weight:300;
  font-size:11px;
  letter-spacing:.3em;
  color:var(--cream-dim);
  display:flex; gap:14px; align-items:center; justify-content:center;
  width:100%;
  flex-wrap:wrap;
}
.time-band .gold-dot{color:var(--gold);}

.signature{
  margin-top:46px;
  font-family:'Aref Ruqaa', serif;
  font-weight:700;
  font-size:clamp(20px, 5vw, 28px);
  color:var(--cream);
  letter-spacing:.02em;
  display:flex; align-items:baseline; justify-content:center; gap:.5em;
  width:100%;
}
.signature .conj{
  font-family:'Amiri', serif;
  font-style:italic;
  font-weight:400;
  font-size:.6em;
  color:var(--gold);
  transform:translateY(-.15em);
}

.arrived{
  font-family:'Aref Ruqaa', serif;
  font-weight:700;
  font-size:clamp(44px, 10vw, 72px);
  color:var(--bloom);
  line-height:1.2;
  text-align:center;
  text-shadow:0 0 30px rgba(184,92,92,.25);
}
.arrived-sub{
  font-family:'Amiri', serif;
  font-style:italic;
  font-size:14px;
  color:var(--cream-dim);
  margin-top:18px;
  letter-spacing:.05em;
  text-align:center;
}

@media (max-width:520px){
  .units-row{max-width:340px;}
  .signature{margin-top:36px;}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;}
  .stage > *{opacity:1; transform:none;}
  .flora{display:none;}
}
</style>
</head>

  <div id="arrived" style="display:none;">
    <div class="arrived">اليَومُ المَوعُود</div>
    <div class="arrived-sub">حُضُورُكُم يُسْعِدُنَا</div>
  </div>
</div>

<script>
(function(){
  const TARGET = new Date('2026-08-21T20:00:00+03:00').getTime();
  const arabicDigits = ['٠','١','٢','٣','٤','٥','٦','٧','٨','٩'];

  function toArabic(n, pad){
    let s = String(n);
    if(pad) s = s.padStart(pad, '0');
    return s.split('').map(c => /\d/.test(c) ? arabicDigits[+c] : c).join('');
  }
  function dayLabel(n){
    if(n <= 1) return 'يوم';
    if(n === 2) return 'يومان';
    if(n >= 3 && n <= 10) return 'أيام';
    return 'يوماً';
  }

  function tick(){
    const active = document.getElementById('active');
    const arrived = document.getElementById('arrived');
    const diff = TARGET - Date.now();

    if(diff <= 0){
      if(active) active.style.display = 'none';
      if(arrived) arrived.style.display = 'block';
      return;
    }
    const days  = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins  = Math.floor((diff % 3600000) / 60000);
    const secs  = Math.floor((diff % 60000) / 1000);

    const dEl = document.getElementById('cd-days');
    const dLabel = document.getElementById('cd-days-label');
    const hEl = document.getElementById('cd-hours');
    const mEl = document.getElementById('cd-mins');
    const sEl = document.getElementById('cd-secs');

    if(dEl) dEl.textContent = toArabic(days);
    if(dLabel) dLabel.textContent = dayLabel(days);
    if(hEl) hEl.textContent = toArabic(hours, 2);
    if(mEl) mEl.textContent = toArabic(mins, 2);
    if(sEl) sEl.textContent = toArabic(secs, 2);
  }

  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
